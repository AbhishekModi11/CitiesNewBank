services:
  postgres:
    image: postgres:16-alpine
    container_name: citipay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: citipay
      POSTGRES_USER: citipay_user
      POSTGRES_PASSWORD: citipay_secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citipay_user -d citipay"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: citipay-backend
    restart: unless-stopped
    environment:
      PORT: 4000
      NODE_ENV: production
      DEMO: "1"
      JWT_SECRET: "citi-drunix-production-jwt-secret-key-32b"
      JWT_EXPIRES_IN: "15m"
      FRONTEND_ORIGINS: "http://localhost:5173,http://localhost:80"
      LEDGER_MODE: "local"
      LLM_PROVIDER: "none"
      DB_CLIENT: "postgres"
      DATABASE_URL: "postgresql://citipay_user:citipay_secure_password@postgres:5432/citipay"
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: citipay-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
